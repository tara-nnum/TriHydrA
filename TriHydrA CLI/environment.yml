name: trihydra-cli

# Keep one consistent solver channel. Mixing defaults and conda-forge produced
# binary incompatibilities in the previous local environment.
channels:
  - conda-forge
  - nodefaults

dependencies:
  # Runtime
  - python=3.11
  - numpy
  # OpenBLAS avoids the Windows MKL runtime crash observed in numpy.corrcoef.
  - libblas=*=*openblas
  - pandas
  - scipy
  - xarray
  - statsmodels
  - ruptures

  # CARAVAN NetCDF and AIFL xarray-pickle support
  - netcdf4
  - h5netcdf
  - h5py

  # Interactive HTML diagnostics
  - plotly
  - pillow

  # Validated TOML configuration
  - pydantic>=2

  # Development tests
  - pytest>=8,<9
