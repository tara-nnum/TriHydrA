# TriHydrA example configuration
# Copy this file to trihydra.toml and edit the paths and variable names.

[run]
# Choose exactly one mode: station_ids, station_file, or all_stations=true.
# Example A — selected IDs:
# station_ids = ["GRDC_3634220"]
# Example B — one ID per line in a text file (the active example below):
station_file = "stations_20.txt" # ---> this is what is active currently
# Example C — every station in the observation NetCDF:
all_stations = false
# Do not activate more than one of these three selection modes at once.
continue_on_station_error = true

[layers]
layer1 = true
layer2 = true
layer3 = true
comparison = true

# TriHydrA currently supports a continuous station-by-time NetCDF reference.
[observation]
name = "observation"
path = "data/caravan_observations.nc"
format = "netcdf"
variable = "streamflow"
station_coordinate = "basin"
time_coordinate = "date"
units = "mm/day"

# Optional AIFL long-term result pickle or directory.
[simulation]
# Observation-only run: set enabled=false and layers.comparison=false.
# Observation–AIFL run: keep enabled=true and point path to either the
# trusted <station_id>_results.p file or the directory containing those files.
enabled = true
format = "aifl_pickle"
path = "data"
model_name = "AIFL"
units = "mm/day"
# Pickle can execute code. Enable this only for files from a trusted source.
trusted = true
# Only contemporaneous time_step=0 is a dated simulation output.
time_step = 0
observation_variable = "streamflow_obs"
simulation_variable = "streamflow_sim"

[output]
directory = "outputs/stations_20_all_layers"
# "ask" prompts after calculations in an interactive terminal. For an
# unattended HPC job, set "all", "review_only", or "none" explicitly.
# Examples: "all" for development inspection, "review_only" to reduce files,
# and "none" for a NetCDF/log-only HPC run.
html_mode = "all"

# Safe fallback when html_mode="ask" but no interactive terminal is attached.
non_interactive_html_mode = "all"
show_figures = false
write_text = true
# Write one consolidated, self-documenting summary for all selected stations.
write_netcdf = true
write_log = true
display_decimals = 3

[comparison]
# Prefer performance metrics supplied with the model output.
calculate_daily_metrics = false
include_provided_metrics = true

[layer1.missing_values]
enabled = true

[layer1.long_gaps]
enabled = true
# Evidence table includes gaps longer than this; composite tiers are below.
minimum_reported_gap_days = 3

[layer1.negative_discharge]
enabled = true
# Values closer to zero than this tolerance are treated as numerical noise.
tolerance = 0.001

[layer1.duplicate_timestamps]
enabled = true

[layer1.timestep_consistency]
enabled = true

# Layer 1 assessment settings can be adapted to an organisation's review policy.
[layer1.composite.tier_points]
tier_3 = 0
tier_2 = 1
tier_1 = 2

[layer1.composite.missing_values]
tier_2_minimum_percent = 5.0
# Tier 1 applies strictly above this percentage.
tier_1_above_percent = 15.0

[layer1.composite.long_gaps]
# Gaps longer than 5 days contribute to the missing-day dependency rules.
long_gap_definition_days = 5
tier_2_minimum_days = 6
tier_1_minimum_days = 31
tier_2_missing_share = 0.50
tier_1_missing_share = 0.25

[layer1.composite.negative_discharge]
# Q05 percentile, equivalent to the conventional FDC Q95 low-flow value.
low_flow_reference_quantile = 0.05
# Tier 1 begins when negative magnitude reaches this multiple of low flow.
tier_1_reference_multiplier = 1.0

[layer1.composite.low_variability]
# Retained plateaus from 15–30 days are Tier 2; Tier 1 begins here.
tier_1_minimum_days = 31

[layer1.composite.spike_dip]
# Tier 2 contains 1–5 unresolved candidates by default.
tier_1_minimum_unresolved_count = 6

[layer1.composite.classification]
minor_concerns_minimum_score = 3
needs_review_minimum_score = 8

[layer1.composite.weights]
missing_values = 2
long_gaps = 2
duplicate_timestamps = 3
timestep_consistency = 3
negative_discharge = 3
spike_dip = 1
low_variability = 1
step_shift = 3
epoch_drift = 2

[layer1.zero_flow_regime]
enabled = true
decimals = 3

[layer1.low_variability]
enabled = true
# Repeated non-zero flow must persist for at least this many days.
minimum_plateau_days = 15
decimals = 3

[layer1.spike_dip]
enabled = true
minimum_recovery = 0.80
minimum_score = 8.0
absolute_change_reference_quantile = 0.99
score_reference_quantile = 0.995
robust_mad_multiplier = 6.0
# Outer daily changes must reach this multiple of the normal monthly change.
minimum_outer_change_multiplier = 1.0

[layer1.step_shift]
enabled = true
long_record_min_years = 12.0
long_record_block_years = 4
short_record_divisor = 3.0
minimum_block_years = 1
minimum_valid_days_per_month = 10
minimum_block_coverage = 0.55
minimum_calendar_months = 8
structural_threshold = 3.0
# Q05 and Q25 percentiles correspond to FDC Q95 and Q75 low-flow levels.
tier_3_maximum_quantile = 0.05
tier_1_minimum_quantile = 0.25
# Points assigned to each retained boundary before averaging across the record.
tier_3_points = 0.0
tier_2_points = 1.0
tier_1_points = 2.0
# Score >= 1.0 is Tier 2; score strictly > 1.5 is Tier 1.
composite_tier_2_minimum_score = 1.0
composite_tier_1_above_score = 1.5
# Search and evidence windows are half the adaptive block length by default.
refinement_block_fraction = 0.5
consolidation_max_block_widths = 2.0

[layer1.epoch_drift]
enabled = true
minimum_valid_days_per_month = 10
minimum_valid_months_per_year = 8
epoch_years = 5
minimum_valid_annual_levels = 5
annual_noise_floor_log = 0.03
meaningful_epoch_change_score = 1.0
# Final station tier uses the share of assessed years classified as stable.
tier_3_minimum_stable_fraction = 0.75
tier_2_minimum_stable_fraction = 0.50
overview_epochs_per_segment = 4
maximum_overview_slopes = 4

[layer2.annual]
minimum_valid_days_per_year = 30
minimum_valid_days_per_month = 10
# Lyne-Hollick digital-filter settings used for the baseflow index.
baseflow_alpha = 0.925
baseflow_passes = 3
minimum_baseflow_segment_days = 3

[layer2.events]
# Events cross Q95 and their shoulders remain above Q90.
trigger_percentile = 0.95
boundary_percentile = 0.90
# A one-day threshold exceedance cannot explain the spike that created it.
spike_crosscheck_minimum_event_duration_days = 3.0

[layer2.comparison]
# Inverse JSD and cosine similarity use the same similarity boundaries.
similarity_tier3_minimum = 0.80
similarity_tier2_minimum = 0.50
# At least this many comparison components are required for a classification.
minimum_assessable_components = 4
# Month differences are circular: December and January are one month apart.
seasonal_timing_tier3_max_months = 1
seasonal_timing_tier2_max_months = 3
time_to_peak_tier3_max_days = 3.0
time_to_peak_tier1_min_days = 5.0
event_duration_tier3_max_days = 3.0
event_duration_tier2_max_days = 7.0
similar_score_maximum = 2
review_score_maximum = 7

[layer2.comparison.weights]
flow_behaviour = 1
annual_flashiness_shape = 1
annual_baseflow_shape = 1
seasonal_profile_shape = 1
seasonal_timing = 1
event_time_to_peak = 1
event_duration = 1
representative_event_shape = 1

[layer3]
# Layer 3 example: select the target and its possible context gauges under
# [run] and set layers.layer3=true above. That is the sole Layer 3 execution
# switch. TriHydrA does not automatically load nearby gauges omitted from the run.

[layer3.metadata]
context_path = "data/context.csv"
# The Köppen–Geiger raster and legend are bundled with TriHydrA. 
# Advanced users may add climate_raster and climate_legend here to override them.

[layer3.plotting]
# "recommended", "all", or "none"
mode = "all"

[layer3.comparison]
# Relative influence on shared Layer 2 context checks.
local_context_weight = 0.70
comparable_catchment_weight = 0.30
# Detailed context plots require at least this overall comparability.
report_minimum_similarity_percent = 50.0

[layer3.analogue_peers]
# Broad safety limit; comparable gauges must also match climate and area rules.
maximum_search_radius_km = 1000.0
